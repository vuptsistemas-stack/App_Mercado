workflows:
  ios-debug-sem-assinatura:
    name: iOS Debug sem assinatura
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Flutter pub get
        script: flutter pub get
      - name: Instalar pods iOS
        script: |
          cd ios
          pod install
      - name: Build iOS debug sem assinatura
        script: |
          flutter build ios --debug --no-codesign \
            --dart-define=APP_PACKAGE=br.com.apppreco.appmercado \
            --dart-define=MERCADO_ID=464a6ab3-31ed-431b-a43a-e8cd57d7c44e \
            --dart-define=MERCADO_CODIGO=sao_mateus
    artifacts:
      - build/ios/iphoneos/**/*.app
      - /tmp/xcodebuild_logs/*.log
