workflows:
  ios-debug-sem-assinatura:
    name: iOS Debug sem assinatura
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Flutter pub get
        script: flutter pub get
      - name: Instalar pods iOS
        script: |
          cd ios
          pod install
      - name: Build iOS debug sem assinatura
        script: |
          flutter build ios --debug --no-codesign \
            --dart-define=APP_PACKAGE=br.com.apppreco.appmercado \
            --dart-define=MERCADO_ID=464a6ab3-31ed-431b-a43a-e8cd57d7c44e \
            --dart-define=MERCADO_CODIGO=sao_mateus
    artifacts:
      - build/ios/iphoneos/**/*.app
      - /tmp/xcodebuild_logs/*.log

  ios-sao-mateus-testflight:
    name: iOS Sao Mateus - TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: br.com.apppreco.mercado.saomateus
    scripts:
      - name: Flutter pub get
        script: flutter pub get
      - name: Instalar pods iOS
        script: |
          cd ios
          pod install
      - name: Criar e configurar assinatura iOS
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build iOS release assinado
        script: |
          flutter build ipa --release \
            --dart-define=APP_PACKAGE=br.com.apppreco.mercado.saomateus \
            --dart-define=MERCADO_ID=464a6ab3-31ed-431b-a43a-e8cd57d7c44e \
            --dart-define=MERCADO_CODIGO=sao_mateus \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
